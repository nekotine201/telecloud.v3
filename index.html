    <script>
      // Safeguard against: TypeError: Cannot set property fetch of #<Window> which has only a getter
      (function() {
        try {
          var nativeFetch = window.fetch;
          var activeFetch = nativeFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return activeFetch || nativeFetch;
            },
            set: function(val) {
              activeFetch = val;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          // Safe fallback if window property is sealed
        }
      })();
    </script>
